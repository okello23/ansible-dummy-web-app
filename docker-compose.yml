services:
  web:
    build: .
    container_name: omnipulse_webapp
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_NAME=OmniPulse Commerce Portal
      - APP_ENV=production
      - DEBUG=False
      - PORT=5000
      - SECRET_KEY=docker-secret-key-change-in-production-12345
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=AnsibleAdmin2026!
      - DB_TYPE=mysql
      - DB_NAME=dashboard
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password123
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: omnipulse_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: dashboard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
