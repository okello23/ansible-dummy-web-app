# Inventory configuration for Ansible deployment
[webservers]
#localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Use this block if you got access to a second machine
# <machine-name-or-IP> ansible_user=<e.g centos or ubuntu> ansible_become=true ansible_become_method=sudo

# Example for deploying to remote production servers:
# [production]
# web01.example.com ansible_host=192.168.1.100 ansible_user=deploy
# web02.example.com ansible_host=192.168.1.101 ansible_user=deploy
