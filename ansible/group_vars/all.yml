# ==============================================================================
# Ansible Variables for OmniPulse Web Application Deployment
#   Modify these values or override them via CLI:
#   ansible-playbook -i inventory.ini playbook.yml \
#     -e "app_name='Enterprise Sales Portal' db_user='prod_admin' db_password='MySecretPassword'"
# ==============================================================================

# Application Branding & Server Configuration
app_name: "Nexus Commerce Dashboard"
app_env: "production"
app_debug: false
app_port: 5000
secret_key: "ansible-generated-secret-token-replace-in-production"

# Default Administrator Account
admin_username: "admin"
admin_password: "AnsibleAdmin2026!"

# Database Connection Credentials
# Supported db_type: sqlite, mysql, postgresql
db_type: "mysql"
db_name: "db-name"
db_host: "127.0.0.1"
db_port: 3306
db_user: "your-db-username"
db_password: "your-db-password"

# Target Host Deployment Paths
app_dir: "/var/www/html/ansibleDeployedWebApp"
python_executable: "python3"
app_user: "{{ ansible_user_id }}"
app_group: "{{ ansible_user_id }}"

# Systemd Service Settings (Requires sudo/root when true)
manage_systemd_service: true
systemd_service_name: "ecommerce-dashboard"

# Nginx Reverse Proxy Settings (Requires sudo/root when true)
manage_nginx: true
nginx_port: 80
nginx_server_name: "_"
nginx_site_config_name: "ecommerce-dashboard"
