---
# ==============================================================================
# Ansible Variables for Nexus Commerce Dashboard
#
# Sensitive credentials are maintained in:
#   group_vars/vault.yml
#
# Run using:
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
# ==============================================================================

# ==============================================================================
# Application Branding & Configuration
# ==============================================================================

app_name: "Sample Web App Dashboard"
app_env: "production"
app_debug: false
app_port: 5000

# Application security - credentials from vault.yml
secret_key: "{{ vault_secret_key }}"

# ==============================================================================
# Default Administrator Account
# ==============================================================================

admin_username: "{{ vault_admin_username }}"
admin_password: "{{ vault_admin_password }}"

# ==============================================================================
# Database Configuration
# ==============================================================================

# Supported: sqlite, mysql, postgresql
db_type: "mysql"

db_name: "{{ ansible_user }}"
db_host: "127.0.0.1"
db_port: 3306

# Credentials from vault.yml
db_user: root

# We are going to use socket connection
db_password: "{{ vault_db_password }}"

# Database server provisioning
database_server: "mariadb"
manage_mysql: true
create_database: true

# Database server configuration
database_bind_address: "127.0.0.1"
db_user_host: "127.0.0.1"


# These can be overridden based on the target distribution
mysql_service_name: ""
# We are going to use socket connection
mysql_socket: "{{ '/var/lib/mysql/mysql.sock' if ansible_os_family == 'RedHat' else '/var/run/mysqld/mysqld.sock' }}"

# ==============================================================================
# Target Host & Application Deployment
# ==============================================================================

repo_url: "https://github.com/okello23/ansible-dummy-web-app"
repo_version: main
app_dir: "/home/{{ ansible_user }}/ansible-dummy-web-app"

python_executable: "python3"
app_user: "{{ ansible_user }}"
app_group: "{{ ansible_user }}"

deploy_application: true
manage_python: true

# ==============================================================================
# Python Application Configuration
# ==============================================================================

# Flask WSGI entry point
wsgi_module: "app:app"

gunicorn_workers: 3

# ==============================================================================
# Systemd Service Configuration
# ==============================================================================

manage_systemd_service: true
systemd_service_name: "ecommerce-dashboard"

# ==============================================================================
# Nginx Reverse Proxy Configuration
# ==============================================================================

manage_nginx: true

nginx_port: 80
nginx_server_name: "_"
nginx_site_config_name: "ecommerce-dashboard"
nginx_client_max_body_size: "50M"

# ==============================================================================
# Application Initialization & Validation
# ==============================================================================

run_db_init: true
run_health_check: true
