{% extends "base.html" %}

{% block title %}{{ 'Edit User #' ~ user.id if user else 'Add New User' }} &bull; {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom py-3">
                <div class="d-flex align-items-center justify-content-between">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-person-fill-gear text-primary me-2"></i>
                        {{ 'Edit User #' ~ user.id if user else 'Add New User' }}
                    </h5>
                    <a href="{{ url_for('users_list') }}" class="btn btn-sm btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i>Back to Users
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold small text-secondary">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ user.name if user else '' }}" placeholder="e.g. Alex Henderson" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ user.email if user else '' }}" placeholder="e.g. alex.h@example.com" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="role" class="form-label fw-semibold small text-secondary">System Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="Customer" {% if user and user.role == 'Customer' %}selected{% endif %}>Customer</option>
                                <option value="Manager" {% if user and user.role == 'Manager' %}selected{% endif %}>Manager</option>
                                <option value="Analyst" {% if user and user.role == 'Analyst' %}selected{% endif %}>Analyst</option>
                                <option value="Admin" {% if user and user.role == 'Admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold small text-secondary">Account Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Active" {% if user and user.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Pending" {% if user and user.status == 'Pending' %}selected{% endif %}>Pending</option>
                                <option value="Suspended" {% if user and user.status == 'Suspended' %}selected{% endif %}>Suspended</option>
                                <option value="Inactive" {% if user and user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="country" class="form-label fw-semibold small text-secondary">Country</label>
                            <input type="text" class="form-control" id="country" name="country" 
                                   value="{{ user.country if user else 'United States' }}" placeholder="e.g. Canada" required>
                        </div>
                        <div class="col-md-6">
                            <label for="total_spent" class="form-label fw-semibold small text-secondary">Initial Total Spent ($)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="total_spent" name="total_spent" 
                                   value="{{ user.total_spent if user else '0.00' }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a href="{{ url_for('users_list') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-save2 me-1"></i>{{ 'Update User' if user else 'Create User' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
