{% extends "base.html" %}

{% block title %}{{ 'Edit Item #' ~ item.id if item else 'Add New Catalog Item' }} &bull; {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-bottom py-3">
                <div class="d-flex align-items-center justify-content-between">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-box-seam text-primary me-2"></i>
                        {{ 'Edit Item #' ~ item.id if item else 'Add New Catalog Item' }}
                    </h5>
                    <a href="{{ url_for('items_list') }}" class="btn btn-sm btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i>Back to Items
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold small text-secondary">Product / Item Name</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ item.name if item else '' }}" placeholder="e.g. Smart Ambient LED Lightbar" required autofocus>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="sku" class="form-label fw-semibold small text-secondary">Inventory SKU</label>
                            <input type="text" class="form-control font-monospace" id="sku" name="sku" 
                                   value="{{ item.sku if item else '' }}" placeholder="e.g. LIGHT-001" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold small text-secondary">Category</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="Electronics" {% if item and item.category == 'Electronics' %}selected{% endif %}>Electronics</option>
                                <option value="Wearables" {% if item and item.category == 'Wearables' %}selected{% endif %}>Wearables</option>
                                <option value="Furniture" {% if item and item.category == 'Furniture' %}selected{% endif %}>Furniture</option>
                                <option value="Apparel" {% if item and item.category == 'Apparel' %}selected{% endif %}>Apparel</option>
                                <option value="Sports" {% if item and item.category == 'Sports' %}selected{% endif %}>Sports</option>
                                <option value="Accessories" {% if item and item.category == 'Accessories' %}selected{% endif %}>Accessories</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="price" class="form-label fw-semibold small text-secondary">Unit Price ($)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" 
                                   value="{{ item.price if item else '49.99' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="stock" class="form-label fw-semibold small text-secondary">Initial Stock</label>
                            <input type="number" min="0" class="form-control" id="stock" name="stock" 
                                   value="{{ item.stock if item else '50' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="rating" class="form-label fw-semibold small text-secondary">Rating (1.0 - 5.0)</label>
                            <input type="number" step="0.1" min="1.0" max="5.0" class="form-control" id="rating" name="rating" 
                                   value="{{ item.rating if item else '4.8' }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a href="{{ url_for('items_list') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                            <i class="bi bi-save2 me-1"></i>{{ 'Update Item' if item else 'Create Item' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
